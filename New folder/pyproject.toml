[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spikeattn"
version = "0.1.0"
description = "Patient-wise ECG classification research utilities"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.3",
  "pandas==2.2.3",
  "scipy==1.15.2",
  "scikit-learn==1.6.1",
  "wfdb==4.2.0",
  "PyYAML==6.0.2",
  "python-dotenv==1.0.1",
  "torch==2.6.0+cu124",
  "statsmodels==0.14.4",
  "matplotlib==3.10.0",
  "seaborn==0.13.2",
  "Jinja2==3.1.6",
  "psutil==7.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
